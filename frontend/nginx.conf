# ====================================================================
# Nginx 站点配置：前端静态资源 + 后端 API 反向代理
#   - 静态文件服务
#   - /api 反向代理到 backend:8000（容器服务名）
#   - SPA 路由回退（hash/history 路由皆可）
#   - gzip 压缩
# ====================================================================
server {
    listen       80;
    server_name  _;
    charset      utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- gzip 压缩 ----
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary       on;
    # 优先发送构建期预压缩的 .gz（vite-plugin-compression 生成），省 CPU、提速数倍
    gzip_static     on;

    # ---- SPA 路由回退：找不到资源时回落到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带内容指纹的 js/css 可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # ---- 反向代理 /api 到后端服务 ----
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # —— SSE 关键：关闭缓冲与缓存，让 token 实时下推 ——
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # /metrics 同样反代到后端（可选，方便外部抓取）
    location = /metrics {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # PDF / 故障图片上传体积上限
    client_max_body_size 50m;
}
