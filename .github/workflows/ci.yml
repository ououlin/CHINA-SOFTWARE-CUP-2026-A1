# CI 流程：后端 Python 检查 + 前端 Vue 构建，两个 job 并行执行
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# 同一分支的新提交覆盖旧的运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 后端检查 ============
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: device_repair_test
          POSTGRES_USER: device_repair
          POSTGRES_PASSWORD: device_repair_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U device_repair -d device_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装项目与质量检查依赖
        run: pip install -r requirements-dev.txt

      - name: 设置测试环境变量
        # JWT_SECRET 至少 32 字符，仅用于 CI 测试，不可用于生产
        run: echo "JWT_SECRET=ci-test-secret-please-do-not-use-in-production-32+" >> $GITHUB_ENV

      - name: 设置 PostgreSQL 集成测试连接
        run: echo "TEST_POSTGRES_URL=postgresql+pg8000://device_repair:device_repair_test@127.0.0.1:5432/device_repair_test" >> $GITHUB_ENV

      - name: Python 语法检查（py_compile）
        # 对 backend/app 下所有 .py 文件执行字节码编译，捕获语法错误
        run: |
          find app -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: 关键代码质量检查（ruff）
        # 首阶段阻断语法错误、未定义名称和无效控制流；风格规则后续分批收紧。
        run: ruff check app/ tests/ --select E9,F63,F7,F82

      - name: 运行测试（pytest）
        run: python -m pytest tests/ -q

      - name: 评测数据集与阈值自检
        # 校验 retrieval_cases 扩增后的查询数与 thresholds.json 结构，防止评测配置漂移。
        run: python -m evaluation.run_all --check-only

  # ============ 前端检查 ============
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build
